[package]
name = "dprint-plugin-typstyle"
version = "0.5.0"
authors = ["Kenichi Kamiya <kachick1@gmail.com>"]
edition = "2024"
license = "Apache-2.0"
publish = false
repository = "https://github.com/kachick/dprint-plugin-typstyle"
description = "dprint plugin for Typst formatting using typstyle"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
schema = ["dep:schemars"]

[dependencies]
dprint-core = { version = "0.69.1", features = ["wasm"] }
schemars = { version = "1.2.1", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

# dprint WASM plugins cannot link crates with wasm-bindgen (https://github.com/dprint/dprint/issues/447).
# Typstyle separates wasm-bindgen bindings into `typstyle-wasm` (https://github.com/typstyle-rs/typstyle/pull/309), leaving `typstyle-core` clean.
typstyle-core = "0.15.1"

[lib]
crate-type = ["lib", "cdylib"]
# Distributed only as a dprint WASM plugin with no public Rust API
doctest = false

[workspace]
resolver = "2"
members = ["crates/schemagen"]

# Optimization matching official dprint plugins.
# Do not use `wasm-opt`:
# 1. Official dprint plugins do not use wasm-opt in their build pipelines.
# 2. Historically, wasm-opt caused crashes (https://github.com/dprint/dprint/issues/79).
# 3. rustc release profile with LTO is enough for wasmtime execution.
[profile.release]
opt-level = 3
debug = false
lto = true
debug-assertions = false
overflow-checks = false
panic = "abort"
