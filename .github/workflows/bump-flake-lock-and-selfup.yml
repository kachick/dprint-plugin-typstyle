name: 🤖🆙❄️
on:
  pull_request:
    paths:
      - '.github/workflows/bump-flake-lock-and-selfup.yml'
  schedule:
    # At 10:17 JST on day-of-month 1 and on Monday.
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
    # You can understand the config actually say what in https://crontab.guru/
    - cron: '17 1 1 * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump:
    uses: kachick/workflows/.github/workflows/reusable-bump-flake-lock.yml@main
    with:
      app-id: ${{ vars.SAMU_APP_ID }}
      post-commit-lock-file: nix develop --command cargo xtask selfup
      post-commit-lock-file-title: 'Sync CI dependencies with nixpkgs'
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.SAMU_APP_PRIVATE_KEY }}
