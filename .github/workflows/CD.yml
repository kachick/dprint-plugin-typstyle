name: CD
on:
  workflow_call:
    inputs:
      run_id:
        description: 'Target Run'
        required: true
        type: string
      release:
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    permissions:
      contents: read
      actions: read # For `gh run download`
    strategy:
      fail-fast: false
      # Syntax https://docs.github.com/en/actions/using-jobs/using-a-matrix-for-your-jobs
      matrix:
        # Due to https://github.com/actions/runner/issues/849, we have to use quotes for 'n.0'
        dprint-version: [
          '', # empty means to latest: https://github.com/dprint/check/blob/2f1cf31537886c3bfb05591c031f7744e48ba8a1/action.yml#L8
          '0.57.4', # selfup {"extract":"\\d[^']+","replacer":["dprint", "--version"], "nth": 2}
        ]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Don't use `nix develop` in this steps to avoid other devshell tools and make faster to run
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install dprint
        run: |
          # Don't use quotation for dprint-version, it will be broken for empty(latest) pattern.
          curl -fsSL https://dprint.dev/install.sh | sh -s ${{ matrix.dprint-version }} > /dev/null 2>&1
          echo "/home/runner/.dprint/bin" >> "$GITHUB_PATH"
      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: '3.53.1' # selfup {"extract":"\\d\\.\\d+\\.\\d+","replacer":["task", "--version"]}
      - name: Download pre-built plugin
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          gh run download "$RUN_ID"
          tree dist
      - name: Make sure dependencies
        run: |
          dprint --version
          task --version
          diff --version
      - name: Test
        env:
          PLUGIN_PATH: '${{ github.workspace }}/dist/lib/plugin.wasm'
          SKIP_BUILD: 'true'
        run:
          task test
  release:
    if: inputs.release
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    needs: [check]
    permissions:
      # "contents: write" allows the action to create a release: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions
      contents: write
      actions: read # For `gh run download`
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - env:
          RUN_ID: ${{ inputs.run_id }}
        run: |
          gh run download "$RUN_ID" --repo '${{ github.repository }}'
          tree dist
      - run: |
          gh release create --repo '${{ github.repository }}' --verify-tag "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" dist/lib/plugin.wasm dist/share/schema.json
  stage-npm:
    if: inputs.release
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    needs: [check]
    permissions:
      contents: read
      id-token: write # For npm trusted publishing via OIDC
      actions: read # For `gh run download`
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
      - name: Download pre-built plugin
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          gh run download "$RUN_ID" --repo '${{ github.repository }}'
          tree dist
      - name: Setup npm package
        run: |
          node deployment/npm/setup.js sync-version
      - name: Test npm package
        run: |
          cd deployment/npm
          npm install
          npm test
      - name: Stage npm package
        run: |
          cd deployment/npm
          npm stage publish --access public
