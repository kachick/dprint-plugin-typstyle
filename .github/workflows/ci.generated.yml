# GENERATED BY ./ci.ts -- DO NOT DIRECTLY EDIT

name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - '*'
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621 # v1
      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: '${{ github.ref == ''refs/heads/main'' }}'
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      - name: Build release
        run: cargo build --target wasm32-unknown-unknown --features wasm --release
      - name: Test
        run: cargo test
      - name: Get tag version
        id: get_tag_version
        if: 'startsWith(github.ref, ''refs/tags/'')'
        run: 'echo "TAG_VERSION=${GITHUB_REF/refs\/tags\//}" >> "$GITHUB_OUTPUT"'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
      - name: Setup and test npm deployment
        run: |-
          cd deployment/npm
          npm install
          node setup.js
          npm run test
      - name: Pre-release
        if: 'startsWith(github.ref, ''refs/tags/'')'
        run: |-
          # update config schema to have version
          sed -i 's/typstyle\/0.0.0/typstyle\/${{ steps.get_tag_version.outputs.TAG_VERSION }}/' deployment/schema.json
          # rename the wasm file
          (cd target/wasm32-unknown-unknown/release/ && mv dprint_plugin_typstyle.wasm plugin.wasm)
          # create release notes
          deno run -A ./scripts/generateReleaseNotes.ts ${{ steps.get_tag_version.outputs.TAG_VERSION }} > ${{ github.workspace }}-CHANGELOG.txt
      - name: Release
        if: 'startsWith(github.ref, ''refs/tags/'')'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: |-
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file ${{ github.workspace }}-CHANGELOG.txt \
            target/wasm32-unknown-unknown/release/plugin.wasm \
            deployment/schema.json
      - name: Lint workflow generation
        run: |-
          ./.github/workflows/ci.ts --lint
          ./.github/workflows/publish_npm.ts --lint
          ./.github/workflows/release.ts --lint
          ./.github/workflows/check_updates.ts --lint
