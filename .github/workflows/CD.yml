name: CD
on:
  workflow_call:
    inputs:
      run_id:
        description: 'Target Run'
        required: true
        type: string
      release:
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    permissions:
      contents: read
      actions: read # For `gh run download`
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Don't use `nix develop` in this steps to avoid other devshell tools and make faster to run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dprint
        run: |
          curl -fsSL https://dprint.dev/install.sh | sh > /dev/null 2>&1
          echo "/home/runner/.dprint/bin" >> "$GITHUB_PATH"
      - name: Download pre-built plugin
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          gh run download "$RUN_ID"
          tree dist
      - name: Make sure dependencies
        run: |
          dprint --version
          cargo --version
          diff --version
      - name: Test
        env:
          PLUGIN_PATH: '${{ github.workspace }}/dist/lib/plugin.wasm'
          SKIP_BUILD: 'true'
        run:
          cargo --locked x test
  verify-version:
    if: inputs.release
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify git tag matches configuration versions
        run: |
          CARGO_VERSION=$(grep -m 1 '^version = ' Cargo.toml | cut -d '"' -f 2)
          NPM_VERSION=$(grep -m 1 '"version":' npm/package.json | cut -d '"' -f 4)
          TAG_VERSION="$GITHUB_REF_NAME"

          echo "Tag version: $TAG_VERSION"
          echo "Cargo.toml version: $CARGO_VERSION"
          echo "npm/package.json version: $NPM_VERSION"

          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Git tag '$TAG_VERSION' does not match Cargo.toml version '$CARGO_VERSION'"
            exit 1
          fi

          if [ "$TAG_VERSION" != "$NPM_VERSION" ]; then
            echo "::error::Git tag '$TAG_VERSION' does not match npm/package.json version '$NPM_VERSION'"
            exit 1
          fi
  release:
    if: inputs.release
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    needs: [check, verify-version]
    permissions:
      # "contents: write" allows the action to create a release: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions
      contents: write
      actions: read # For `gh run download`
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - env:
          RUN_ID: ${{ inputs.run_id }}
        run: |
          gh run download "$RUN_ID" --repo '${{ github.repository }}'
          tree dist
      - run: |
          gh release create --repo '${{ github.repository }}' --verify-tag "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --draft dist/lib/plugin.wasm dist/share/schema.json
  stage-npm:
    if: inputs.release
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    needs: [check, verify-version]
    permissions:
      contents: read
      id-token: write # For npm trusted publishing via OIDC
      actions: read # For `gh run download`
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-nix
      - name: Install dependencies
        run: |
          url="$(nix eval --raw --impure --expr '(builtins.fromJSON (builtins.readFile ./flake.lock)).nodes.nixpkgs.locked.url')"
          nix profile add "${url}#nodejs" "${url}#betterleaks"
      - name: Download pre-built plugin
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          gh run download "$RUN_ID" --repo '${{ github.repository }}'
          tree dist
      - name: Stage npm package
        run: |
          cp dist/lib/plugin.wasm npm/plugin.wasm
          cp dist/share/schema.json npm/schema.json
          cp LICENSE npm/LICENSE
          cp NOTICE npm/NOTICE
          cp README.md npm/README.md
          cd npm
          betterleaks dir .
          npm stage publish
