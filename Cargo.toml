[package]
name = "dprint-plugin-typstyle"
version = "0.5.3"
authors = ["Kenichi Kamiya <kachick1@gmail.com>"]
edition = "2024"
homepage = "https://github.com/dprint/dprint-plugin-typstyle"
keywords = ["formatting", "formatter", "typst", "typstyle"]
license = "Apache-2.0"
publish = false
repository = "https://github.com/dprint/dprint-plugin-typstyle"
description = "Typst formatter for dprint via typstyle."

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
opt-level = 3
debug = false
lto = true
debug-assertions = false
overflow-checks = false
panic = "abort"

[features]
wasm = ["serde_json", "dprint-core/wasm"]

[dependencies]
dprint-core = { version = "0.71.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", optional = true }
thiserror = "2"
# dprint Wasm plugins cannot link crates with wasm-bindgen (https://github.com/dprint/dprint/issues/447).
# Typstyle separates wasm-bindgen bindings into `typstyle-wasm` (https://github.com/typstyle-rs/typstyle/pull/309), leaving `typstyle-core` clean.
# scripts/update.ts keeps typst-syntax on the version that typstyle-core depends on.
typst-syntax = "0.15.1"
typstyle-core = "0.15.2"

[dev-dependencies]
dprint-development = "0.12.1"
serde_json = "1.0.154"
